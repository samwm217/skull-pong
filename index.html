<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Skull Pong is a retro-style pong game with a spooky twist! Control the paddle and bounce the glitching skull through a flickering red-and-blue grid for endless fun. Play now!">
  <title>Skull Pong</title>
  <style>
    :root {
      --paddle-width: 15%; /* Paddle width as a percentage */
      --paddle-height: 2%; /* Default paddle height */
      --ball-size: 8vw; /* Ball size scales with viewport width */
    }

    body {
      background: black;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .pong-container {
      width: 100vw; /* Fullscreen width */
      height: 100vh; /* Fullscreen height */
      position: relative;
      overflow: hidden;
      background: black;
    }

    /* Red Dot Grid */
    .retro-grid-red {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.5) 10%, transparent 10%) 0 0;
      background-size: 30px 30px;
      z-index: 1;
      animation: flicker-red 1.5s infinite alternate;
    }

    /* Blue Dot Grid */
    .retro-grid-blue {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0, 0, 255, 0.5) 10%, transparent 10%) 15px 15px;
      background-size: 30px 30px;
      z-index: 1;
      animation: flicker-blue 1.5s infinite alternate;
    }

    @keyframes flicker-red {
      0%, 100% {
        opacity: 0.8;
        filter: brightness(1);
      }
      50% {
        opacity: 0.3;
        filter: brightness(1.2);
      }
    }

    @keyframes flicker-blue {
      0%, 100% {
        opacity: 0.3;
        filter: brightness(1.2);
      }
      50% {
        opacity: 0.8;
        filter: brightness(1.5);
      }
    }

    .paddle {
      width: var(--paddle-width);
      height: var(--paddle-height); /* Paddle height variable */
      background: white;
      position: absolute;
      bottom: 5%;
      left: 42.5%;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
      z-index: 2;
    }

    /* Media Query for Mobile */
    @media (max-width: 768px) {
      :root {
        --paddle-height: 6%; /* Increase paddle height on smaller screens */
      }
    }

    .ball {
      width: var(--ball-size);
      height: var(--ball-size);
      background: transparent;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--ball-size) * 0.8);
      animation: glitch-ball 0.5s infinite;
      z-index: 2;
    }

    @keyframes glitch-ball {
      0%, 100% {
        text-shadow: 4px 0 red, -4px 0 blue;
      }
      50% {
        text-shadow: -4px 0 red, 4px 0 blue;
      }
    }
  </style>
</head>
<body>
  <div class="pong-container">
    <div class="retro-grid-red"></div>
    <div class="retro-grid-blue"></div>
    <div class="paddle"></div>
    <div class="ball">💀</div>
  </div>

  <script>
    // DOM Elements
    const paddle = document.querySelector('.paddle');
    const ball = document.querySelector('.ball');
    const container = document.querySelector('.pong-container');

    // Paddle Variables
    let paddleX = 42.5; // Paddle's initial X position (percentage)
    const paddleWidth = 15; // Paddle width as percentage of container

    // Ball Variables
    let ballX = 50; // Ball's initial X position
    let ballY = 50; // Ball's initial Y position
    let ballDX = 0.7; // Horizontal speed
    let ballDY = 0.7; // Vertical speed
    const minSpeed = 0.5; // Minimum speed
    const speedIncrement = 0.05; // Speed increase after collision

    // Lives Variable
    let lives = 10; // Player starts with 10 lives

    // Paddle Movement for Desktop (Mouse)
    container.addEventListener('mousemove', (e) => {
      const containerWidth = container.offsetWidth;
      const mouseX = e.clientX - container.offsetLeft;

      // Calculate paddle position as percentage
      paddleX = (mouseX / containerWidth) * 100;

      // Constrain paddle within bounds
      paddleX = Math.max(0, Math.min(100 - paddleWidth, paddleX));

      // Update paddle position
      paddle.style.left = `${paddleX}%`;
    });

    // Paddle Movement for Mobile (Touch)
    container.addEventListener('touchmove', (e) => {
      const containerWidth = container.offsetWidth;
      const touchX = e.touches[0].clientX - container.offsetLeft;

      // Calculate paddle position as percentage
      paddleX = (touchX / containerWidth) * 100;

      // Constrain paddle within bounds
      paddleX = Math.max(0, Math.min(100 - paddleWidth, paddleX));

      // Update paddle position
      paddle.style.left = `${paddleX}%`;

      // Prevent default scrolling behavior
      e.preventDefault();
    });

    // Add Randomness to Ball Movement
    function randomizeDirection() {
      const randomFactor = (Math.random() - 0.5) * 0.2; // Random adjustment between -0.1 and 0.1
      ballDX += randomFactor;

      // Ensure minimum speed is maintained
      ballDX = Math.max(minSpeed, Math.abs(ballDX)) * Math.sign(ballDX);
    }

    // Game Loop
    function gameLoop() {
      const nextBallX = ballX + ballDX;
      const nextBallY = ballY + ballDY;

      // Ball Collision with Walls
      if (nextBallX <= 0 || nextBallX >= 100) {
        ballDX *= -1; // Reverse horizontal direction
      }

      if (nextBallY <= 0) {
        ballDY *= -1; // Reverse vertical direction
      }

      // Ball Collision with Paddle
      const paddleTop = 95; // Paddle's top edge in percentage (bottom 5%)
      const paddleLeft = paddleX;
      const paddleRight = paddleX + paddleWidth;

      if (
        nextBallY >= paddleTop - 2 && // Detect collision slightly above the paddle
        ballY < paddleTop && // Ball is moving downward
        nextBallX >= paddleLeft && // Ball is within paddle's left edge
        nextBallX <= paddleRight // Ball is within paddle's right edge
      ) {
        ballDY = -Math.abs(ballDY); // Bounce upward
        ballY = paddleTop - 8; // Snap ball to just above the paddle
        randomizeDirection(); // Add randomness to ball direction
        ballDY -= speedIncrement; // Increase vertical speed slightly
        ballDX += speedIncrement * Math.sign(ballDX); // Increment horizontal speed
      } else {
        ballX = nextBallX;
        ballY = nextBallY;
      }

      // Reset Ball if It Falls Below Paddle
      if (nextBallY > 100) {
        lives--; // Decrease lives by 1

        if (lives <= 0) {
          alert('Game Over! You’ve used all your lives!');
          ballX = 50;
          ballY = 50;
          ballDX = 0.7;
          ballDY = 0.7;
          lives = 10; // Reset lives for next play
        } else {
          // Reset ball position for next life
          ballX = 50;
          ballY = 50;
          ballDX = 0.7;
          ballDY = 0.7;
        }
      }

      // Update Ball Position
      ball.style.left = `${ballX}%`;
      ball.style.top = `${ballY}%`;

      // Repeat Game Loop
      requestAnimationFrame(gameLoop);
    }

    // Start Game Loop
    gameLoop();
  </script>
</body>
</html>
