<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Skull Pong is a retro-style pong game with a spooky twist! Control the paddle and bounce the glitching skull through a flickering red-and-blue grid for endless fun. Play now!">
  <title>Skull Pong</title>
  <style>
    :root {
      --paddle-width: 15%; /* Paddle width as a percentage */
      --ball-size: 8vw; /* Ball size scales with viewport width */
    }

    body {
      background: black;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .pong-container {
      width: 100vw; /* Fullscreen width */
      height: 100vh; /* Fullscreen height */
      position: relative;
      overflow: hidden;
      background: black;
    }

    /* Red Dot Grid */
    .retro-grid-red {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.5) 10%, transparent 10%) 0 0;
      background-size: 30px 30px;
      z-index: 1;
      animation: flicker-red 1.5s infinite alternate;
    }

    /* Blue Dot Grid */
    .retro-grid-blue {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0, 0, 255, 0.5) 10%, transparent 10%) 15px 15px;
      background-size: 30px 30px;
      z-index: 1;
      animation: flicker-blue 1.5s infinite alternate;
    }

    @keyframes flicker-red {
      0%, 100% {
        opacity: 0.8;
        filter: brightness(1);
      }
      50% {
        opacity: 0.3;
        filter: brightness(1.2);
      }
    }

    @keyframes flicker-blue {
      0%, 100% {
        opacity: 0.3;
        filter: brightness(1.2);
      }
      50% {
        opacity: 0.8;
        filter: brightness(1.5);
      }
    }

    .paddle {
      width: var(--paddle-width);
      height: 2%;
      background: white;
      position: absolute;
      bottom: 5%;
      left: 42.5%;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
      z-index: 2;
    }

    .ball {
      width: var(--ball-size);
      height: var(--ball-size);
      background: transparent;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--ball-size) * 0.8);
      animation: glitch-ball 0.5s infinite;
      z-index: 2;
    }

    @keyframes glitch-ball {
      0%, 100% {
        text-shadow: 4px 0 red, -4px 0 blue;
      }
      50% {
        text-shadow: -4px 0 red, 4px 0 blue;
      }
    }
  </
